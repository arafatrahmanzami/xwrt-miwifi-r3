name: Build X-WRT Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/Makefile'
      - '**/*.apk'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  TZ: UTC
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_HASHDIR: 1
  BUILD_JOBS: "2"
  OPENWRT_SHA: d4ebb18563a339494615984509e9a149fb320090

jobs:
  prepare:
    name: Prepare sources
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Maximize build space + swap
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk \
            git gettext libssl-dev xsltproc wget unzip python3 rsync \
            subversion flex bison libelf-dev bc \
            nodejs npm ninja-build texinfo ccache

      - name: Clone X-WRT
        run: |
          git clone https://github.com/x-wrt/x-wrt.git openwrt
          cd openwrt
          git checkout "$OPENWRT_SHA" || git checkout master

      - name: Copy custom packages
        run: |
          for pkg in internet-detector internet-detector-mod-email internet-detector-mod-modem-restart internet-detector-mod-telegram \
                     luci-app-internet-detector luci-app-cpu-status-mini luci-theme-argon \
                     luci-app-argon-config luci-app-pppoe-manager luci-app-access-shield \
                     luci-app-quickactions luci-app-ports-status-mod luci-theme-matrix \
                     luci-theme-material3 luci-app-notes luci-app-linkspeed \
                     luci-app-dashboard luci-app-trafficctl luci-app-easymesh \
                     WrtGram openlink-portal luci-app-client-monitor-prebuilt \
                     luci-app-easy-setup-prebuilt; do
            if [ -d "$pkg" ]; then
              cp -r "$pkg" openwrt/package/
            fi
          done

      - name: Restore feeds cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/feeds
          key: feeds-${{ runner.os }}-${{ env.OPENWRT_SHA }}-${{ hashFiles('**/feeds.conf*') }}
          restore-keys: |
            feeds-${{ runner.os }}-${{ env.OPENWRT_SHA }}-

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-${{ env.OPENWRT_SHA }}
          restore-keys: |
            dl-${{ runner.os }}-

      - name: Apply feeds & fixes
        run: |
          cat > openwrt/feeds.conf.default << 'EOF'
          src-git-full packages https://github.com/x-wrt/packages.git
          src-git-full luci https://github.com/x-wrt/luci.git
          src-git-full routing https://github.com/x-wrt/routing.git
          src-git-full telephony https://github.com/x-wrt/telephony.git
          src-git-full video https://github.com/x-wrt/video.git
          src-git-full x https://github.com/x-wrt/com.x-wrt.git
          src-git routing_upstream https://git.openwrt.org/feed/routing.git;openwrt-25.12
          src-git packages_upstream https://git.openwrt.org/feed/packages.git;master
          EOF
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          sed -i '/^LUCI_NAME?=/i PKG_VERSION?=25.12' feeds/luci/luci.mk
          rm -rf package/feeds/packages_upstream/fwknop
          rm -rf package/feeds/packages_upstream/squeezelite
          rm -rf package/feeds/luci/luci-app-fwknopd
          rm -rf package/feeds/*/luci-app-easymesh/meta-packages
          rm -f package/feeds/x/luci-theme-argon
          rm -rf package/feeds/*/luci-app-bandix
          rm -rf package/feeds/*/luci-app-bandix-plus
          rm -rf package/feeds/*/openwrt-bandix
          rm -rf package/feeds/*/openwrt-bandix-plus
          
          # Remove samba4 package to prevent OOM
          rm -rf feeds/packages/net/samba4
          rm -rf package/feeds/packages/samba4
          rm -rf package/feeds/packages/luci-app-samba4

          # ---------------------------------------------------------
          # OFFICIAL FIX FOR GCC OOM / FORK STORM
          # Prevents the toolchain build from spawning uncontrolled threads
          # ---------------------------------------------------------
          sed -i '/HOST_MAKE_FLAGS +=/i \ ifneq ($(filter -j%,$(filter-out -j1,$(MAKECMDGOALS) $(MAKEFLAGS))),)\nHOST_JOBS_MAX := 4\nendif\n' toolchain/gcc/common.mk

      - name: Restore config and resolve
        run: |
          echo "" | base64 -d | gunzip > openwrt/.config
          cd openwrt
          make defconfig

      - name: Download sources
        run: cd openwrt && make download -j8

      - name: Save feeds cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/feeds
          key: feeds-${{ runner.os }}-${{ env.OPENWRT_SHA }}-${{ hashFiles('**/feeds.conf*') }}-${{ github.run_id }}

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-${{ env.OPENWRT_SHA }}-${{ github.run_id }}

  build:
    name: Build firmware (-j2, 8GB swap)
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Maximize build space + swap
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk \
            git gettext libssl-dev xsltproc wget unzip python3 rsync \
            subversion flex bison libelf-dev bc \
            nodejs npm ninja-build texinfo ccache

      - name: Clone X-WRT
        run: |
          git clone https://github.com/x-wrt/x-wrt.git openwrt
          cd openwrt
          git checkout "$OPENWRT_SHA" || git checkout master

      - name: Copy custom packages
        run: |
          for pkg in internet-detector internet-detector-mod-email internet-detector-mod-modem-restart internet-detector-mod-telegram \
                     luci-app-internet-detector luci-app-cpu-status-mini luci-theme-argon \
                     luci-app-argon-config luci-app-pppoe-manager luci-app-access-shield \
                     luci-app-quickactions luci-app-ports-status-mod luci-theme-matrix \
                     luci-theme-material3 luci-app-notes luci-app-linkspeed \
                     luci-app-dashboard luci-app-trafficctl luci-app-easymesh \
                     WrtGram openlink-portal luci-app-client-monitor-prebuilt \
                     luci-app-easy-setup-prebuilt; do
            if [ -d "$pkg" ]; then
              cp -r "$pkg" openwrt/package/
            fi
          done

      - name: Restore feeds cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/feeds
          key: feeds-${{ runner.os }}-${{ env.OPENWRT_SHA }}-${{ hashFiles('**/feeds.conf*') }}-${{ github.run_id }}
          restore-keys: |
            feeds-${{ runner.os }}-${{ env.OPENWRT_SHA }}-

      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ runner.os }}-${{ env.OPENWRT_SHA }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-build-
            ccache-${{ runner.os }}-

      - name: Apply feeds & fixes
        run: |
          cat > openwrt/feeds.conf.default << 'EOF'
          src-git-full packages https://github.com/x-wrt/packages.git
          src-git-full luci https://github.com/x-wrt/luci.git
          src-git-full routing https://github.com/x-wrt/routing.git
          src-git-full telephony https://github.com/x-wrt/telephony.git
          src-git-full video https://github.com/x-wrt/video.git
          src-git-full x https://github.com/x-wrt/com.x-wrt.git
          src-git routing_upstream https://git.openwrt.org/feed/routing.git;openwrt-25.12
          src-git packages_upstream https://git.openwrt.org/feed/packages.git;master
          EOF
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          sed -i '/^LUCI_NAME?=/i PKG_VERSION?=25.12' feeds/luci/luci.mk
          rm -rf package/feeds/packages_upstream/fwknop
          rm -rf package/feeds/packages_upstream/squeezelite
          rm -rf package/feeds/luci/luci-app-fwknopd
          rm -rf package/feeds/*/luci-app-easymesh/meta-packages
          rm -f package/feeds/x/luci-theme-argon
          rm -rf package/feeds/*/luci-app-bandix
          rm -rf package/feeds/*/luci-app-bandix-plus
          rm -rf package/feeds/*/openwrt-bandix
          rm -rf package/feeds/*/openwrt-bandix-plus
          
          rm -rf feeds/packages/net/samba4
          rm -rf package/feeds/packages/samba4
          rm -rf package/feeds/packages/luci-app-samba4

          # OFFICIAL FIX FOR GCC OOM / FORK STORM
          sed -i '/HOST_MAKE_FLAGS +=/i \ ifneq ($(filter -j%,$(filter-out -j1,$(MAKECMDGOALS) $(MAKEFLAGS))),)\nHOST_JOBS_MAX := 4\nendif\n' toolchain/gcc/common.mk

      - name: Restore config and resolve
        run: |
          echo "" | base64 -d | gunzip > openwrt/.config
          cd openwrt
          make defconfig

      - name: Build firmware and packages (Safe Timeout)
        run: |
          cd openwrt
          timeout 330m make -j${BUILD_JOBS} V=s IGNORE_ERRORS=m 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -eq 124 ]; then
            echo "### ⏰ Build Timed Out (5.5 Hours)" >> $GITHUB_STEP_SUMMARY
            echo "The build exceeded 5.5 hours. **Please click 'Re-run failed jobs'.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Verify custom packages and show errors
        run: |
          cd openwrt
          FAILED=$(grep -aE 'ERROR: package/(internet-detector|luci-app-internet-detector|luci-app-cpu-status-mini|luci-theme-argon|luci-app-argon-config|luci-app-pppoe-manager|luci-app-access-shield|luci-app-quickactions|luci-app-ports-status-mod|luci-theme-matrix|luci-theme-material3|luci-app-notes|luci-app-linkspeed|luci-app-dashboard|luci-app-trafficctl|luci-app-easymesh|WrtGram|openlink-portal|luci-app-client-monitor-prebuilt|luci-app-easy-setup-prebuilt) failed to build' build.log) || true
          if [ -n "$FAILED" ]; then
            echo "### ❌ Custom package failure" >> $GITHUB_STEP_SUMMARY
            echo "$FAILED" >> $GITHUB_STEP_SUMMARY
            echo "❌ CUSTOM PACKAGE FAILED:"
            echo "$FAILED"
            echo "--- SHOWING LAST 50 LINES OF BUILD LOG ---"
            tail -n 50 build.log
            exit 1
          fi
          echo "✅ All custom packages built." >> $GITHUB_STEP_SUMMARY

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ runner.os }}-build-${{ github.sha }}-${{ github.run_id }}

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            openwrt/bin/
            openwrt/build.log
          if-no-files-found: warn
          retention-days: 5

  image:
    name: Package and release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Package outputs
        run: |
          mkdir -p output
          if [ -d bin/targets/ramips/mt7620 ]; then
            mkdir -p output/targets
            cp -r bin/targets/ramips/mt7620/* output/targets/
          fi
          if [ -d bin/packages/mipsel_24kc ]; then
            tar -czf output/packages.tar.gz -C bin/packages/mipsel_24kc .
          fi

      - name: Upload to Release
        if: hashFiles('output/targets/*') != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "X-WRT build ${{ github.run_number }}"
          body: |
            Build from ${{ env.OPENWRT_SHA }} (or latest master).
            Target: ramips/mt7620, Xiaomi MiWiFi R3.
          files: |
            output/targets/*
            output/packages.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
